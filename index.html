<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>deepdive</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <aside id="left-rail">
      <nav id="history"></nav>
    </aside>

    <section id="content">
      <h1 id="title"></h1>
      <p id="summary"></p>

      <button id="toggle-full">Read full article</button>
      <section id="full-article" hidden></section>

      <section id="paths">
        <h2>Where to go next</h2>
        <div id="path-list"></div>
      </section>
    </section>

    <aside id="right-rail">
      <!-- future: depth, modes, metadata -->
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
